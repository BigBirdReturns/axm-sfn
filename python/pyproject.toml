[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-sfn"
version = "0.1.0"
description = "AXM SFN fabrication spoke — compiles custody sessions into AXM Layer 2 journal shards"
requires-python = ">=3.11"
dependencies = [
    # The kernel. Until axm-genesis is on PyPI, pin the commit you build
    # against (axm-genesis docs/ADOPTING.md §2); after the v1.0.0 release use
    # axm-genesis[mldsa-compat]>=1.0.0,<2. sfn imports only axm_build / axm_verify
    # (the kernel), so it depends on axm-genesis directly, not the axm-core hub;
    # all crypto comes transitively — do not declare blake3/pynacl directly (INV-26).
    "axm-genesis[mldsa-compat] @ git+https://github.com/BigBirdReturns/axm-genesis.git@bdeb2ba07f83ff3fae07e5beb335034f4853a73f",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
axm-sfn-compile = "axm_sfn.compile:main"

[project.entry-points."axm.spokes"]
sfn = "axm_sfn.cli:sfn_group"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
