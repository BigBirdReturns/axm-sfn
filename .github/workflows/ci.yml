# Enforce the promises on every push: the Go edge daemon builds, and the
# Python spoke compiles a custody session into a shard the kernel verifier
# accepts (one pass, no reseal). The kernel is installed from the pinned
# commit (axm-genesis docs/ADOPTING.md §2); keep the ref in sync with the pin
# in python/pyproject.toml.
name: ci

on:
  push:
  pull_request:

jobs:
  python-spoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: axm-sfn

      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-genesis
          ref: fffe7cf0f1c78c8c4bea5f303099db80f7c53ba3
          path: axm-genesis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kernel and spoke
        run: |
          python -m pip install --upgrade pip
          pip install './axm-genesis[mldsa-compat]'
          pip install -e './axm-sfn/python[dev]'

      - name: Spoke tests (compile -> verify roundtrip + shard-only recompute)
        working-directory: axm-sfn/python
        run: python -m pytest tests/ -v

      - name: Drift check (kernel-boundary lint, sourced from genesis)
        run: bash axm-genesis/tools/drift-check.sh axm-sfn

  edge-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build, vet, and test the axm-edge daemon
        run: |
          go build ./cmd/...
          go vet ./...
          go test ./...
